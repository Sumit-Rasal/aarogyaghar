<div class="services-hero">
  <div class="container">
    <h1>Our Seva (Services)</h1>
    <p>Providing holistic support to ensure dignity and health for every senior we serve — completely free of charge.
    </p>
  </div>
</div>

<div class="services-content">
  <div class="container">
    <div *ngFor="let service of services; let i = index" class="service-section" [class.reverse]="i % 2 === 1">
      <div class="service-image" [style.background]="service.gradient">
        <svg *ngIf="service.id === 'medical-coordination'" width="128" height="128" viewBox="0 0 24 24" fill="none"
          stroke="white" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <svg *ngIf="service.id === 'financial-assistance'" width="128" height="128" viewBox="0 0 24 24" fill="white">
          <text x="12" y="18" text-anchor="middle" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif">₹</text>
        </svg>
      </div>

      <div class="service-details">
        <h2>{{ service.title }}</h2>
        <p class="service-description">{{ service.description }}</p>

        <div class="features-box">
          <h3>How We Help</h3>
          <ul>
            <li *ngFor="let feature of service.features">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>{{ feature }}</span>
            </li>
          </ul>
        </div>

        <a routerLink="/contact" class="btn-primary">Request Help</a>
      </div>
    </div>
  </div>
</div>
