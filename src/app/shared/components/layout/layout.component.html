<header [class.scrolled]="isHeaderScrolled">
  <nav>
    <div class="logo">
      <a routerLink="/">
        <img src="/logo.svg" alt="AarogyaGhar Logo">
      </a>
    </div>

    <!-- Hamburger Menu Button -->
    <button class="hamburger" (click)="toggleMobileMenu()" [class.active]="isMobileMenuOpen" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" [class.open]="isMobileMenuOpen">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
          (click)="closeMobileMenu()">Home</a></li>
      <li><a routerLink="/services" routerLinkActive="active" (click)="closeMobileMenu()">Services</a></li>
      <li><a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About Us</a></li>
      <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact</a></li>
    </ul>
    <a routerLink="/contact" class="btn-nav" [class.open]="isMobileMenuOpen" (click)="closeMobileMenu()">Get Help
      Today</a>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>

<!-- Scroll to Top Button -->
<button class="scroll-to-top" [class.visible]="showScrollTop" (click)="scrollToTop()" aria-label="Scroll to top">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M18 15l-6-6-6 6" />
  </svg>
</button>
